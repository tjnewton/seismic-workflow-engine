# Local commit-time leak guard + standard hygiene.
# Activate once:  pip install pre-commit && pre-commit install && pre-commit install --hook-type pre-push
# The core guard is a local hook so it works without network; the private
# name-tokens live out-of-repo (see scripts/leak_guard.py).
repos:
  - repo: local
    hooks:
      - id: swe-leak-guard
        name: leak guard (private/large/secret content)
        entry: python scripts/leak_guard.py
        language: system
        pass_filenames: true
        stages: [pre-commit, pre-push]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=25600"]
      - id: detect-private-key
      - id: check-merge-conflict
