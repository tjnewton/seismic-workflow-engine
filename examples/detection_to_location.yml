# Detection-to-Location pipeline
#
# Starts from existing templates, runs matched-filter detection and writes the
# detections as markers.
#
# Not included: location. NonLinLoc reads the phase file its control file names,
# and a detection Party is not a Catalog, so no step here can write that file;
# write it from party.get_catalog() in Python, then run swe.location.run_nonlinloc.
# A date range with no detection gives no Party, and write_detections then fails.
#
# Run with:
#   swe run examples/detection_to_location.yml

steps:
  - name: build_templates
    function: swe.detection.markers_to_template
    cache: false
    params:
      marker_file_path: "data/picks.mrkr"
      prepick_offset: 2.0

  - name: start_date
    function: obspy.UTCDateTime
    params: {year: 2019, month: 7, day: 4}

  - name: end_date
    function: obspy.UTCDateTime
    params: {year: 2019, month: 7, day: 6}

  - name: run_detection
    function: swe.detection.detect_signals
    params:
      templates: ${build_templates.templates}
      template_files: ["data/templates/*.ms"]
      station_dict: ${build_templates.station_dict}
      template_length: 16.0
      template_prepick: 2.0
      detection_files_path: "data/continuous/"
      start_date: ${start_date}
      end_date: ${end_date}
      thresh_type: "MAD"
      detect_thresh: 8.0
      trig_int: 8.0
      lowcut: 1.0
      highcut: 15.0
      samp_rate: 100.0

  - name: write_detections
    function: swe.io.party_to_markers
    params:
      party: ${run_detection}
      output_path: "output/detections.mrkr"

