# Full end-to-end seismic analysis pipeline
#
# Downloads waveforms and responses, runs phase picking and association.
# Not included: location (swe.location.run_nonlinloc reads a phase file, and
# no step writes the association result to one).
#
# Steps pass data through files, which the dependency graph cannot see,
# so run them in order:
#   swe run examples/full_pipeline.yml
#
# Not included, as one step cannot express them: noise windows
# (find_noise_windows needs (start, end) UTCDateTime pairs, which params cannot
# build), magnitudes, focal mechanisms and stress inversion (they need per-event
# waveforms and polarity observations; see swe.magnitude and swe.focal).

steps:
  # --- Data acquisition ---

  - name: download_waveforms
    function: swe.io.fdsn.get_waveforms
    params:
      network: "CI"
      stations: ["WBS", "WRC2", "WCS2"]
      channels: ["BHZ", "BHN", "BHE"]
      start_time: "2019-07-04T17:00:00"
      end_time: "2019-07-05T06:00:00"
      output_dir: "data/waveforms"
      client: "SCEDC"

  - name: download_responses
    function: swe.io.fdsn.get_response_files
    params:
      network: "CI"
      stations: ["WBS", "WRC2", "WCS2"]
      channel: "BHZ"
      start_time: "2019-07-04T17:00:00"
      end_time: "2019-07-05T06:00:00"
      output_dir: "data/responses"
      client: "SCEDC"

  # --- Phase picking ---

  - name: load_waveforms
    function: obspy.read
    cache: false
    params:
      pathname_or_url: "data/waveforms/*.ms"

  - name: pick_phases
    function: swe.picking.predict_phase_arrivals
    params:
      stream: ${load_waveforms}
      model_name: "PhaseNet"
      pretrained: "original"
      p_threshold: 0.3
      s_threshold: 0.3
      batch_size: 256

  # --- Association ---

  - name: associate_events
    function: swe.association.associate_picks
    params:
      station_picks: ${pick_phases}
      station_list: ["WBS", "WRC2", "WCS2"]
      location_dict:
        WBS: [-117.599, 35.765, 0.732]
        WRC2: [-117.636, 35.734, 0.685]
        WCS2: [-117.652, 35.747, 0.905]
      dbscan_eps: 0.5
      dbscan_min_samples: 5
      min_picks_per_cluster: 4
