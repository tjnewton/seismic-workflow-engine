# Stress analysis pipeline
#
# Groups events by location and inverts their focal mechanisms for the
# regional stress tensor of each group.
#
# Focal mechanisms are read from a table: measuring polarities and solving
# mechanisms (swe.focal.measure_polarities, compute_takeoff_angles_1d,
# focal_mechanisms_batch) works on one event's stream and source at a time,
# which a step cannot loop over, so those steps were removed.
#
# Run with:
#   swe run examples/stress_analysis.yml

steps:
  - name: load_hypocenters
    function: numpy.loadtxt
    cache: false
    params:
      fname: "data/focal_mechanisms.csv"  # header, then x, y, depth (km), strike, dip, rake
      delimiter: ","
      skiprows: 1
      usecols: [0, 1, 2]  # cluster_events uses Euclidean distance: give x, y in km, not degrees
      ndmin: 2

  - name: load_mechanisms
    function: numpy.loadtxt
    cache: false
    params:
      fname: "data/focal_mechanisms.csv"
      delimiter: ","
      skiprows: 1
      usecols: [3, 4, 5]
      ndmin: 2

  - name: cluster_mechanisms
    function: swe.stress.cluster_focal_mechanisms
    params:
      data: ${load_hypocenters}
      n_clusters: 3

  - name: invert_stress
    function: swe.stress.stress_inversion
    params:
      data: ${load_mechanisms}
      labels: ${cluster_mechanisms.labels}
