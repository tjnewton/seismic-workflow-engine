[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seismic-workflow-engine"
version = "0.3.0"
description = "Modular seismic analysis toolkit: noise classification, phase picking, association, matched-filter detection, hypocenter location, magnitude estimation, focal mechanisms, moment tensors, stress inversion, and YAML pipeline orchestration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Tyler Newton"},
]
keywords = ["seismology", "earthquake", "waveform", "detection", "obspy", "focal-mechanism", "moment-tensor", "magnitude", "pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "obspy>=1.4",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "eqcorrscan>=0.5",
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "geopy>=2.0",
    "tqdm>=4.60",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/tjnewton/seismic-workflow-engine"

[project.optional-dependencies]
picking = ["seisbench>=0.4"]
association = ["pyocto>=0.1", "gamma-seismology"]
topo = ["laspy>=2.0", "rasterio>=1.3"]
velocity = ["ttcrpy"]
all = ["seismic-workflow-engine[picking,association,topo,velocity]"]
docs = [
    "sphinx>=7.0",
    "furo",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "myst-parser",
    "numpydoc",
    "nbsphinx>=0.9",
    "sphinxcontrib-mermaid>=0.9",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
swe = "swe.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["integration: cross-module integration tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["swe"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["swe"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
]
